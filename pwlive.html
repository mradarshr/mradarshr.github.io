<!DOCTYPE html>
<html>
<head>
	<title>VED Player</title>
	<link rel="stylesheet" href="https://cdn.plyr.io/3.6.8/plyr.css" />
	<script src="https://cdn.plyr.io/3.6.8/plyr.polyfilled.js"></script>
</head>
<body>
	<h1>VEDxNDA Powered by Adarsh Rathaur</h1>
	<h3>Kindly Turn On Auto Rotate on Your Phone to use Full Screen Video Feature.</h3>

	<div class="container">
	<video controls crossorigin playsinline poster="https://i.ibb.co/yqHF2HK/vedxpw.jpg">
	    <source src="https://pwlive-fc142a2d3222.herokuapp.com/?quality=240&v=" type="application/x-mpegURL" size="240">
		 <source src="https://pwlive-fc142a2d3222.herokuapp.com/?quality=360&v=" type="application/x-mpegURL" size="360">
			<source src="https://pwlive-fc142a2d3222.herokuapp.com/?quality=480&v=" type="application/x-mpegURL" size="480">
			<source src="https://pwlive-fc142a2d3222.herokuapp.com/?quality=720&v=" type="application/x-mpegURL" size="720">

			<!-- Caption files -->
			<track kind="captions" label="English" srclang="en" src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-HD.en.vtt"
					default>
			<track kind="captions" label="Français" srclang="fr" src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-HD.fr.vtt">
			<!-- Fallback for browsers that don't support the <video> element -->
			<a href="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-576p.mp4" download>Download</a>
	</video>
</div>
<!-- Plyr resources and browser polyfills are specified in the pen settings -->

<style type="text/css">
	.container {
	margin: 50px auto;
	max-width: 1000px;
}
</style>

<script type="text/javascript">
	const player = new Plyr('video', {captions: {active: true}});

// Expose player so it can be used from the console
window.player = player;
</script>

</body>
</html>
